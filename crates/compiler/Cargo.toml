[package]
name = "truframe-compiler"
version = "0.0.0"
description = "Truframe design document to Next.js/Astro compiler"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# rlib for cargo test, cdylib for the WASM build (`pnpm compiler:build`).
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly: the wasm-bindgen CLI that generates the JS glue must be the same version.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
