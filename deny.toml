# cargo-deny: license allowlist from AGENTS.md, plus bans/sources/advisories.
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "0BSD",
  "CC0-1.0",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Our own crates are proprietary and unpublished.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
