version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Deliberate pins (see docs/project/MEMORY.md decisions); lift these when the reason goes away.
    ignore:
      # TypeScript 7 (native) is new; Next.js tooling is proven on 5.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @cloudflare/vitest-pool-workers (needed from P2) supports Vitest 4 only.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Types must match the Node runtime we target (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
